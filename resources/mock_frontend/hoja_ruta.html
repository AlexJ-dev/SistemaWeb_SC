<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Hoja de Ruta del Paciente</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-lg p-8">
    
    <!-- ENCABEZADO VISUAL -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center">
        <img src="Logo/Logo_Sagrado_Corazon.jpeg" alt="Logo" class="w-20 h-20 object-contain" />
        <div class="ml-4">
          <h1 class="text-2xl font-bold">
          <span class="text-gray-700">Servicios Médicos</span>
          <span class="text-[#9C1C2A]">SAGRADO CORAZÓN</span>
        </h1>
        </div>
      </div>
    </div>

    <div id="datosPaciente" class="grid grid-cols-2 gap-4 mb-6"></div>
    <table class="w-full border border-gray-300 text-sm mb-6">
      <thead class="bg-gray-100 text-gray-700 uppercase">
        <tr>
          <th class="border px-2 py-2 text-center">Aplica</th>
          <th class="border px-2 py-2">Evaluaciones</th>
          <th class="border px-2 py-2">Lugar</th>
          <th class="border px-2 py-2">Hora Ingreso</th>
          <th class="border px-2 py-2">Hora Salida</th>
          <th class="border px-2 py-2">Encargado</th>
          <th class="border px-2 py-2">Observaciones</th>
        </tr>
      </thead>
      <tbody id="tablaEvaluaciones"></tbody>
    </table>

    <div class="flex justify-end space-x-4">
      <button id="guardarBtn" class="bg-red-800 text-white px-6 py-2 rounded hover:bg-red-700 transition">
        Guardar Cambios
      </button>
      <a href="pacientes.html" class="bg-gray-300 text-gray-800 px-6 py-2 rounded hover:bg-gray-400 transition">Salir</a>
    </div>
  </div>

  <script>
    const dni = new URLSearchParams(location.search).get("dni");
    const rutas = JSON.parse(localStorage.getItem("rutas") || "{}");
    const hoja = rutas[dni];

    if (!hoja) {
      document.body.innerHTML = "<p class='text-center text-red-600 font-bold'>Hoja de ruta no encontrada.</p>";
    } else {
      document.getElementById("datosPaciente").innerHTML = `
        <p><strong>Nombre Completo:</strong> ${hoja.nombre}</p>
        <p><strong>DNI:</strong> ${hoja.dni}</p>
        <p><strong>Cargo:</strong> ${hoja.cargo}</p>
        <p><strong>Empresa:</strong> ${hoja.empresa}</p>
        <p><strong>Hora de Ingreso:</strong> ${hoja.horaIngresoGeneral || "No registrada"}</p>
        <p><strong>Tipo de Evaluación:</strong> ${hoja.tipoEvaluacion?.length ? hoja.tipoEvaluacion.join(", ").toUpperCase() : "No marcada"}</p>
      `;

      const tbody = document.getElementById("tablaEvaluaciones");
      hoja.evaluaciones.forEach(eval => {
        const fila = document.createElement("tr");
        fila.innerHTML = `
          <td class="border px-2 py-2 text-center">
            <input type="checkbox" class="chk-aplica accent-red-700" ${eval.aplica !== false ? 'checked' : ''} />
          </td>
          <td class="border px-2 py-2">${eval.area}</td>
          <td class="border px-2 py-2">${eval.piso}</td>
          <td class="border px-2 py-2"><input type="time" value="${eval.horaIngreso || ''}" class="w-full px-2 outline-none" /></td>
          <td class="border px-2 py-2"><input type="time" value="${eval.horaSalida || ''}" class="w-full px-2 outline-none" /></td>
          <td class="border px-2 py-2"><input type="text" value="${eval.encargado || ''}" class="w-full px-2 outline-none" /></td>
          <td class="border px-2 py-2"><input type="text" value="${eval.observaciones || ''}" class="w-full px-2 outline-none" /></td>
        `;
        if (eval.aplica === false) {
  fila.classList.add("line-through", "bg-gray-100");
  fila.querySelectorAll("input[type='text'], input[type='time']").forEach(inp => {
    inp.disabled = true;
    inp.classList.add("text-gray-500"); // tono intermedio, no tan pálido
  });
}

        tbody.appendChild(fila);
      });

      // Guardar cambios
      document.getElementById("guardarBtn").addEventListener("click", () => {
        const filas = document.querySelectorAll("#tablaEvaluaciones tr");
        hoja.evaluaciones = Array.from(filas).map(tr => ({
          aplica: tr.children[0].querySelector("input").checked,
          area: tr.children[1].textContent,
          piso: tr.children[2].textContent,
          horaIngreso: tr.children[3].querySelector("input").value,
          horaSalida: tr.children[4].querySelector("input").value,
          encargado: tr.children[5].querySelector("input").value,
          observaciones: tr.children[6].querySelector("input").value
        }));
        rutas[dni] = hoja;
        localStorage.setItem("rutas", JSON.stringify(rutas));
        alert("✅ Cambios guardados correctamente");
      });
    }

    // Listener para aplicar/no aplicar
    document.getElementById("tablaEvaluaciones").addEventListener("change", e => {
      if (e.target.classList.contains("chk-aplica")) {
        const fila = e.target.closest("tr");
        const disabled = !e.target.checked;
        fila.classList.toggle("line-through", disabled);
        fila.classList.toggle("bg-gray-100", disabled);
        fila.querySelectorAll("input[type='text'], input[type='time']").forEach(inp => inp.disabled = disabled);
      }
    });
  </script>
</body>
</html>
