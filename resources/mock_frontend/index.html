<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de Inicio</title>
  <!-- Estilos compilados con Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-96">
    <h1 class="text-2xl font-bold text-red-600 text-center mb-6">Bienvenido</h1>

    <form>
      <div class="mb-4">
        <label class="block text-gray-700">Usuario</label>
        <input type="text" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500">
      </div>

      <div class="mb-4">
        <label class="block text-gray-700">Contraseña</label>
        <input type="password" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-red-500">
      </div>

      <button type="button" onclick="login()" class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700 transition">
        Ingresar
      </button>
    </form>
  </div>

  <!-- JS compilado -->
  <script src="../../public/build/app.js"></script>
</body>
</html>
