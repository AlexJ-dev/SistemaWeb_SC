<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Evaluación de Área - Sagrado Corazón</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto bg-white shadow-lg rounded-lg p-8">
        
        <header class="mb-8 border-b pb-4">
            <h1 class="text-3xl font-extrabold text-gray-700">Módulo de Evaluación</h1>
            <h2 id="tituloArea" class="text-2xl font-bold text-red-800 mt-1"></h2>
        </header>

        <main>
            
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Obtener el parámetro 'area' de la URL
            const params = new URLSearchParams(window.location.search);
            const area = params.get('area');

            if (area) {
                // 2. Formatear y mostrar el nombre del área
                const areaFormateada = area.replace(/_/g, ' '); // Reemplaza guiones bajos por espacios
                document.getElementById('tituloArea').textContent = areaFormateada.toUpperCase();
                
                // 3. Personalizar el mensaje de bienvenida
                document.getElementById('mensajeArea').innerHTML = 
                    `Has ingresado al área de <strong class="text-blue-900">${areaFormateada}</strong>. Usa esta ventana para registrar las evaluaciones de los pacientes y completar la Hoja de Ruta.`;

            } else {
                // Manejo de error si no se especifica el área
                document.getElementById('tituloArea').textContent = 'Área No Especificada';
                document.getElementById('mensajeArea').textContent = 'Por favor, regrese a la página de selección y elija un área válida.';
            }
        });
    </script>
</body>
</html>
